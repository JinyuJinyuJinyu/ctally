# Publishes CTally to PyPI whenever a GitHub release is published, so `pipx install ctally`
# gets it. Uses PyPI's Trusted Publishing: PyPI trusts this workflow in this repository, so no
# token is stored anywhere. The release's tag must match the version in
# src/ctally/__init__.py: v0.2.0 for "0.2.0".
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          version=$(python -c 'import re, pathlib; print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("src/ctally/__init__.py").read_text()).group(1))')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version $version in src/ctally/__init__.py"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ctally/
    permissions:
      id-token: write       # what Trusted Publishing proves itself with
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
