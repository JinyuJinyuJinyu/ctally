# Runs the tests and pyflakes on every push and pull request, on Ubuntu and macOS: the oldest
# Python CTally supports, which gets an older Qt, and the newest Qt supports. Nothing is
# published from here; see publish.yml for that.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is built for Ubuntu 24.04 at the latest, so not for whatever ubuntu-latest becomes next.
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # tmux for the tests that run private tmux servers (they're skipped without it), and the
      # libraries Qt loads even when it draws offscreen.
      - name: Install tmux and Qt's libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install tmux
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: python -m pip install -e . pytest pyflakes
      - run: python -m pyflakes src tools tests
      - run: python -m pytest tests
